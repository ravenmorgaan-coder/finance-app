<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Мои финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:dark;
  /* Темно-фиолетово-сиреневая тема с градиентным фоном */
  --top:#241445;
  --bg:#0d0619;
  --card:rgba(50,34,92,.62);
  --card2:#2a1f4a;
  --sheet:#1d1438;
  --text:#efeaff;
  --hint:#9a90b8;
  --accent:#b9a2ff;
  --accent-text:#1a0f33;
  --line:rgba(255,255,255,.07);
  --red:#ff6b6b;--green:#4fd18b;--orange:#f2a65a;--blue:#7cc4ff;
}
html{background:var(--bg)}
body{background:transparent}
/* Фон-градиент лежит на отдельном неподвижном слое: так он не «едет» при прокрутке на телефоне */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 55% at 85% -10%, rgba(170,120,255,.20) 0%, rgba(170,120,255,0) 60%),
    radial-gradient(90% 50% at -10% 45%, rgba(110,60,210,.14) 0%, rgba(110,60,210,0) 60%),
    radial-gradient(100% 60% at 110% 105%, rgba(200,110,255,.10) 0%, rgba(200,110,255,0) 60%),
    linear-gradient(170deg, #1a0d33 0%, #110824 40%, #0b0518 75%, #070310 100%)}
html,body{margin:0;color:var(--text);font:15px/1.35 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body.lock{overflow:hidden}
#view{padding:12px 12px calc(170px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden}
.pad{padding:10px 14px}
.hint{color:var(--hint);font-size:13px}
.pos{color:var(--green)}.neg{color:var(--red)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.mnav b{font-size:17px}
.mnav button{border:0;background:var(--card);color:var(--text);width:42px;height:36px;border-radius:10px;font-size:20px;cursor:pointer}
.summary{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 14px;gap:6px}
.summary div{display:flex;flex-direction:column;gap:2px;min-width:0}
.summary b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search,label input,label select,label textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.search,label input,label textarea{-webkit-appearance:none;appearance:none}
label textarea{resize:vertical}
.searchbox{position:relative;margin-bottom:10px}
.searchbox svg{position:absolute;z-index:1;left:12px;top:50%;transform:translateY(-50%);color:var(--hint);pointer-events:none}
.search{padding-left:38px!important}
.i{width:22px;height:22px;display:block}
.ic{color:var(--hint)}
.ic.cat{font-weight:600;font-size:14px;border-radius:10px}
.mnav button svg,.x svg{margin:auto}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:var(--text)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);color:var(--text);padding:7px 12px;border-radius:999px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-text)}
/* Поле-кнопка вместо системного списка */
.selfield{display:flex;align-items:center;gap:10px;width:100%;margin-top:4px;min-height:46px;padding:7px 12px;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:left;cursor:pointer}
.selfield:disabled{opacity:.55;cursor:default}
.panel .selfield{background:var(--card2)}
.selfield .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selfield .grow small{color:var(--hint);font-size:13px;margin-left:6px}
.selfield>.i:last-child{color:var(--hint);flex:none}
.selfield .ic{width:30px;height:30px;border-radius:9px}
.selfield .ic .i{width:17px;height:17px}
.amtrow .selfield{min-height:56px}
/* Окно выбора */
.prow .chk{color:var(--accent);flex:none}
.prow.on .tt{color:var(--accent)}
.subchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px 58px;border-bottom:1px solid var(--line)}
.subchips:last-child{border-bottom:0}
.subchips .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);font-size:13.5px;padding:6px 11px}
.subchips .chip .i{width:15px;height:15px;opacity:.8}
.subchips .chip.on{background:var(--accent);color:var(--accent-text)}
.hasSubs{border-bottom:0!important}
/* Библиотека иконок */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:6px}
.igrid button{aspect-ratio:1;border:0;border-radius:12px;background:var(--card2);color:var(--hint);display:grid;place-items:center;cursor:pointer;font:inherit;font-size:11px}
.igrid button.on{color:inherit;background:#ffffff10;outline:2px solid currentColor;outline-offset:-2px}
.cg{border-bottom:1px solid var(--line);background:transparent}
.cg:last-child{border-bottom:0}
.cg>.row:last-child{border-bottom:0}
.dsub{padding-left:14px!important}
.mvs{display:flex;gap:6px;flex:none}
.mv{width:34px;height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.07);color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0}
.mv:active{background:var(--accent);color:var(--accent-text)}
.mv:disabled{opacity:.2;cursor:default}
.mv.add{color:var(--accent)}
.hidrow .tt{color:var(--hint)}
.sbar{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.sbar .searchbox{flex:1;margin-bottom:0}
.mv.tall{width:46px;height:auto;min-height:44px;background:var(--card);border:1px solid var(--line);color:var(--hint)}
.mv.tall.on{background:var(--accent);color:var(--accent-text);border-color:transparent}
.subic{width:26px!important;height:26px!important;border-radius:8px!important}
.subic .i{width:15px;height:15px}
.day{color:var(--hint);font-size:13px;margin:14px 4px 6px}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:17px;flex:none}
.mid{flex:1;min-width:0}
.tt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--hint);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;color:var(--orange);margin-top:2px}
.note{font-size:12.5px;color:var(--hint);font-style:italic;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.amt{text-align:right;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.amt .hint{font-weight:400}
.amt .rub{font-size:12px;font-weight:400;color:var(--hint);margin-top:1px}
.amtrow{display:flex;gap:8px;align-items:flex-end}
.amtrow label:first-child{flex:1}
.amtrow label:last-child{width:120px;flex:none}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.datebar .datefield{flex:1;margin-top:0}
/* Поле даты: показываем ДД.ММ.ГГГГ сами, а прозрачный системный input сверху открывает календарь */
.datefield{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;margin-top:4px;padding:10px 12px;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.panel .datefield{background:var(--card2)}
.datefield .i{color:var(--hint);flex:none}
.datefield input{position:absolute!important;inset:0;width:100%!important;height:100%;opacity:0;margin:0!important;padding:0!important;border:0!important;cursor:pointer;-webkit-appearance:none;appearance:none}
.datebar .mini{padding:10px 12px;background:var(--card)}
.spark{display:block;width:100%;height:120px}
.wbars{display:flex;gap:4px;height:120px;margin:12px 0 6px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wbar{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.wbar i{width:70%;max-width:18px;border-radius:4px 4px 0 0;background:var(--accent);opacity:.55}
.wcol.sel .wbar i{opacity:1}
.wcol span{font-size:10px;color:var(--hint)}
.wcol.sel span{color:var(--text);font-weight:700}
.wcol{cursor:pointer}
.srow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.limtotal{cursor:pointer}
.intcard{display:flex;gap:12px;align-items:center}
.intcard b{font-size:15px}
.donut{padding:16px 14px}
.dwrap{position:relative;width:210px;max-width:72%;margin:4px auto 14px}
.dsvg{display:block;width:100%;height:auto}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dc b{font-size:19px;margin:2px 0}
.lgs{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.lg{display:flex;align-items:center;gap:8px;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-size:13.5px;padding:5px 0;text-align:left;cursor:pointer}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg .lgn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{font-weight:600;color:var(--hint);font-size:12.5px}
.lgs.one{grid-template-columns:1fr}
.lgs.one .lg{font-size:14.5px;padding:7px 0}
.lg .lga{font-weight:600;white-space:nowrap}
.lgs.one .lg b{width:44px;text-align:right}
.subrow{padding-left:58px}
.link{color:var(--accent);font-size:14px}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:10px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--text);padding:8px 4px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-text)}
.seg button.on.t-expense{background:var(--red);color:#fff}
.seg button.on.t-income{background:var(--green);color:#fff}
.seg button.on.t-refund{background:var(--orange);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-text);margin:12px 0 0;cursor:pointer}
.btn.sec{background:rgba(255,255,255,.07);color:var(--accent)}
.btn.danger{background:transparent;color:var(--red);margin-top:4px}
.mini{border:0;background:var(--bg);color:var(--accent);border-radius:8px;padding:5px 8px;font:inherit;font-size:12px;flex:none;cursor:pointer}
.empty{text-align:center;color:var(--hint);padding:30px 10px}
.big{padding:16px}.big b{display:block;font-size:26px;margin-top:4px}
h3{font-size:15px;margin:18px 4px 8px}
.chart{display:flex;gap:4px;padding:12px 10px 8px;height:170px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
.col .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.bars i{width:40%;max-width:10px;border-radius:3px 3px 0 0;min-height:1px}
.bi{background:var(--green)}.be{background:var(--red)}
.col span{font-size:10px;color:var(--hint)}
.col.sel span{color:var(--text);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--hint);margin:-4px 4px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(22,13,44,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
#tabs button{flex:1;border:0;background:none;color:var(--hint);padding:7px 0 6px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
#tabs button svg{width:22px;height:22px;margin-bottom:2px}
#tabs button.active{color:var(--accent)}

#fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;box-shadow:0 6px 24px rgba(185,162,255,.45);z-index:11;cursor:pointer}
/* Горячая кнопка над «+»: раскрывает быстрые действия */
#qa{position:fixed;right:22px;bottom:calc(140px + env(safe-area-inset-bottom));z-index:12;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#qa.low{bottom:calc(82px + env(safe-area-inset-bottom))}
.qa-main{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#2a1d4d;color:var(--accent);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:transform .15s}
#qa.open .qa-main{background:var(--accent);color:var(--accent-text);transform:rotate(90deg)}
.qa-items{display:none;flex-direction:column;align-items:flex-end;gap:10px}
#qa.open .qa-items{display:flex;animation:qaIn .15s ease}
@keyframes qaIn{from{opacity:0;transform:translateY(8px)}}
.qa-item{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:var(--text)}
.qa-item span{background:#2a1d4d;border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-size:14px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.qa-item i{width:44px;height:44px;border-radius:50%;background:#2a1d4d;border:1px solid var(--line);display:grid;place-items:center;color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.qa-item.on i{background:var(--accent);color:var(--accent-text);border-color:transparent}
.qa-head{font-size:12px;color:var(--hint);margin-right:56px;margin-bottom:-4px}
.qa-item.sugg i{overflow:hidden}
.qa-item.sugg i .ic{width:100%;height:100%;border-radius:50%}
.qa-item.sugg span b{font-weight:600}
.qa-item.last-sugg{margin-bottom:8px}
#qaBack{display:none;position:fixed;inset:0;z-index:11;background:rgba(8,4,20,.35)}
#qaBack.open{display:block}
.pin{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 0 10px}
.pin .lock{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--accent);margin-bottom:14px}
.pin h2{font-size:19px;margin:0 0 6px}
.dots{display:flex;gap:18px;margin:22px 0 30px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--hint);transition:background .1s}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.err{animation:shake .35s}
.dots.err i{border-color:var(--red)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,74px);gap:16px 28px}
.keys button{width:74px;height:74px;border-radius:50%;border:0;background:var(--card);color:var(--text);font:inherit;font-size:28px;cursor:pointer;display:grid;place-items:center}
.keys button:active{background:var(--accent);color:var(--accent-text)}
.keys .ghost{background:transparent;color:var(--hint)}
.keys .small{font-size:15px}
#sheet{position:fixed;inset:0;z-index:20}
#sheet.hidden{display:none}
.backdrop{position:absolute;inset:0;background:rgba(8,4,20,.65)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--sheet);border-radius:16px 16px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease;max-width:640px;margin:0 auto}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.panel .card,.panel .seg,.panel label input,.panel label select,.panel label textarea{background:var(--card2)}
.panel .row .ic{background:var(--card)}
.panel .btn.sec,.panel .x{background:var(--card2)}
.panel .search{background:var(--card2)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;position:sticky;top:-6px;background:var(--sheet);z-index:1}
.sh-head b{font-size:17px}
.x{border:0;background:var(--bg);color:var(--hint);width:32px;height:32px;border-radius:50%;font-size:15px;flex:none;cursor:pointer}
label{display:block;font-size:13px;color:var(--hint);margin:10px 0 0}
label>input,label>select,label>textarea{margin-top:4px}
.amount{font-size:26px!important;font-weight:600}
.check{display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px}
.check input{width:auto;-webkit-appearance:checkbox;appearance:auto;margin:0}
.copy{width:100%;min-height:200px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#3a2a66;color:var(--text);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<main id="view"><div class="empty">Загрузка…</div></main>
<button id="fab" onclick="App.newTx()" aria-label="Добавить операцию"></button>
<div id="qaBack" onclick="App.qaToggle(false)"></div>
<div id="qa"></div>
<nav id="tabs">
  <button data-tab="ops">Операции</button>
  <button data-tab="an">Аналитика</button>
  <button data-tab="acc">Счета</button>
  <button data-tab="cats">Категории</button>
</nav>
<div id="sheet" class="hidden"><div class="backdrop" onclick="App.back()"></div><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= Утилиты ================= */
const TG = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(TG && TG.initData);
const $ = s => document.querySelector(s);
// Буква «Е» с точками не используется: и в интерфейсе, и в сохраненных названиях она показывается как «Е»
const noYo = s => String(s ?? '').replace(/\u0451/g, '\u0435').replace(/\u0401/g, '\u0415');
const esc = s => noYo(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _cnt = 0;
const uid = () => Date.now().toString(36) + (_cnt++ % 1296).toString(36).padStart(2,'0') + Math.random().toString(36).slice(2,5);
const r2 = n => Math.round((+n || 0) * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => dateStr(new Date());
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_PREP = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const NF = new Intl.NumberFormat('ru-RU', {minimumFractionDigits:0, maximumFractionDigits:2});
const CURS = {
  RUB:{s:'₽', n:'Рубль'}, USD:{s:'$', n:'Доллар США'}, EUR:{s:'€', n:'Евро'}, JPY:{s:'¥', n:'Японская иена'},
  CNY:{s:'元', n:'Китайский юань'}, THB:{s:'฿', n:'Тайский бат'}, BYN:{s:'Br', n:'Белорусский рубль'},
};

/* ================= Хранилище =================
   В Telegram: CloudStorage (облако Telegram, привязано к вашему аккаунту и этому боту).
   Вне Telegram (тест в браузере): localStorage.
   Значение в CloudStorage — до 4096 символов, поэтому данные режутся на куски. */
const Store = (() => {
  /* Лимит Telegram — 4096 БАЙТ на одно значение (русская буква = 2 байта, эмодзи = 4).
     Режем данные на куски не длиннее MAXB байт, не разрывая символы. */
  const MAXB = 3800;
  const cloud = !!(IN_TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9'));
  const call = (method, ...args) => new Promise((res, rej) => TG.CloudStorage[method](...args, (err, v) => err ? rej(err) : res(v)));
  async function getMany(keys) {
    const out = {};
    if (!cloud) { keys.forEach(k => out[k] = localStorage.getItem('fin_' + k) || ''); return out; }
    for (let i = 0; i < keys.length; i += 20) Object.assign(out, await call('getItems', keys.slice(i, i + 20)));
    return out;
  }
  async function set(k, v) { if (!cloud) { localStorage.setItem('fin_' + k, v); return; } await call('setItem', k, v); }
  async function del(keys) {
    if (!keys.length) return;
    if (!cloud) { keys.forEach(k => localStorage.removeItem('fin_' + k)); return; }
    for (let i = 0; i < keys.length; i += 20) await call('removeItems', keys.slice(i, i + 20));
  }
  const bytes = cp => cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
  function split(str) {
    const parts = []; let cur = '', size = 0;
    for (const ch of str) {           // for..of идет по целым символам, эмодзи не разрываются
      const b = bytes(ch.codePointAt(0));
      if (size + b > MAXB) { parts.push(cur); cur = ''; size = 0; }
      cur += ch; size += b;
    }
    if (cur) parts.push(cur);
    return parts;
  }
  /* meta — оглавление. Для каждого блока: число кусков и «поколение» записи ("3.k2x9a").
     Новая версия пишется в новые ключи, и только потом оглавление переключается на нее.
     Если запись оборвется на середине, старая версия останется целой. */
  const entry = v => typeof v === 'number' ? {n:v, g:''} : (([n, g]) => ({n:+n, g}))(String(v).split('.'));
  const keyOf = (name, e, i) => e.g ? `${name}__${e.g}_${i}` : `${name}__${i}`;
  const keysOf = (name, e) => Array.from({length:e.n}, (_, i) => keyOf(name, e, i));
  async function readMeta() { const m = (await getMany(['meta'])).meta; return m ? JSON.parse(m) : null; }
  async function readBlobs(meta, names) {
    const keys = [];
    for (const name of names) if (meta.blobs[name] != null) keys.push(...keysOf(name, entry(meta.blobs[name])));
    const vals = await getMany(keys), res = {}, bad = [];
    for (const name of names) {
      if (meta.blobs[name] == null) { res[name] = null; continue; }
      const str = keysOf(name, entry(meta.blobs[name])).map(k => vals[k] || '').join('');
      try { res[name] = JSON.parse(str); } catch (e) { console.error('Поврежден блок', name, e); res[name] = null; bad.push(name); }
    }
    return {res, bad};
  }
  // Все операции с хранилищем идут по очереди, чтобы чтение не попало на середину записи
  let queue = Promise.resolve();
  function enqueue(job) { const p = queue.then(job); queue = p.catch(() => {}); return p; }
  function loadAll() {
    return enqueue(async () => {
      const meta = await readMeta();
      if (!meta) return null;
      const {res, bad} = await readBlobs(meta, Object.keys(meta.blobs));
      res._bad = bad;
      return res;
    });
  }
  /* Безопасное сохранение: перед записью заново читаем свежую версию блока из облака
     (ее могло изменить другое устройство), передаем в fn и записываем результат.
     fallback() — локальная версия на случай, если блок в облаке поврежден. */
  function update(name, fn, fallback) {
    return enqueue(async () => {
      const meta0 = await readMeta() || {v:1, blobs:{}};
      const {res, bad} = await readBlobs(meta0, [name]);
      const data = fn(bad.length && fallback ? fallback() : res[name]);
      const parts = data == null ? [] : split(JSON.stringify(data));
      const e = {n:parts.length, g:(Date.now() % 1e9).toString(36) + Math.random().toString(36).slice(2, 4)};
      for (let i = 0; i < parts.length; i++) await set(keyOf(name, e, i), parts[i]);
      const meta = await readMeta() || {v:1, blobs:{}};  // еще раз свежее оглавление — меняем только свою строку
      const olds = [meta.blobs[name], meta0.blobs[name]].filter(v => v != null).map(entry);
      if (parts.length) meta.blobs[name] = `${e.n}.${e.g}`; else delete meta.blobs[name];
      await set('meta', JSON.stringify(meta));          // ← момент «переключения» на новую версию
      const stale = new Set(); olds.forEach(o => keysOf(name, o).forEach(k => stale.add(k)));
      try { await del([...stale]); } catch (err) { console.warn('Не удалось убрать старые куски', err); }
      return data;
    }).catch(e => {
      console.error(e);
      toast(String(e).includes('TOO_LONG') ? 'Не удалось сохранить: слишком большой блок данных' : 'Не удалось сохранить: ' + e);
      throw e;
    });
  }
  const save = (name, data) => update(name, () => data);
  return {loadAll, update, save, cloud, _split:split};
})();

/* ================= Курсы валют (ЦБ РФ) =================
   Источник: cbr-xml-daily.ru — официальные курсы ЦБ в JSON. Кэшируются на устройстве.
   Для прошедших дат берется курс на эту дату (в выходные — последний рабочий день). */
const Rates = (() => {
  const KEY = 'fin_rates';
  let cache = {}; try { cache = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  const pending = {}, failed = {};
  const keyOf = date => (!date || date >= todayStr()) ? 'latest' : date;
  const parse = data => { const m = {_ts:Date.now(), _date:data.Date.slice(0,10)}; for (const c of Object.keys(CURS)) if (c !== 'RUB' && data.Valute[c]) m[c] = data.Valute[c].Value / data.Valute[c].Nominal; return m; };
  function load(date) {
    const key = keyOf(date), c = cache[key];
    if (c && (key !== 'latest' || Date.now() - c._ts < 3 * 3600e3)) return Promise.resolve(c);
    if (pending[key]) return pending[key];
    return pending[key] = (async () => {
      let data = null;
      if (key === 'latest') { const r = await fetch('https://www.cbr-xml-daily.ru/daily_json.js'); if (r.ok) data = await r.json(); }
      else {
        const d = new Date(date + 'T12:00:00');
        for (let i = 0; i < 10 && !data; i++) {
          try { const r = await fetch(`https://www.cbr-xml-daily.ru/archive/${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}/daily_json.js`); if (r.ok) data = await r.json(); } catch (e) {}
          d.setDate(d.getDate() - 1);
        }
      }
      if (!data) throw new Error('курсы недоступны');
      cache[key] = parse(data);
      try { localStorage.setItem(KEY, JSON.stringify(cache)); } catch (e) {}
      return cache[key];
    })().catch(e => { failed[key] = true; if (c) return c; throw e; }).finally(() => delete pending[key]);
  }
  // Курс: сколько рублей за 1 единицу валюты. null — курс еще не загружен.
  const get = (date, cur) => cur === 'RUB' || !cur ? 1 : ((cache[keyOf(date)] || {})[cur] || null);
  const info = date => cache[keyOf(date)];
  // Если курса нет — загрузить и потом вызвать cb (один раз, без повторов при ошибке)
  function need(date, cb) { const key = keyOf(date); if (cache[key] || pending[key] || failed[key]) return; load(date).then(cb, () => cb && cb()); }
  return {load, get, info, need};
})();

// Порядок категорий задается полем order (его меняет перетаскивание); у старых категорий его нет — тогда по порядку добавления

const rubOf = t => t.rub ?? t.amount;

const accAmtOf = t => t.accAmt ?? t.amount;

    if (t.type !== 'refund' || t.ref !== id || t.id === exceptId) return s;

  }, 0);
};
// Возврат, привязанный к покупке, уменьшает расход в месяце покупки
const effMonth = t => { if (t.type === 'refund' && t.ref) { const o = txById(t.ref); if (o) return o.date.slice(0,7); } return t.date.slice(0,7); };
// Сортировка: новые дни сверху; внутри дня — ваш порядок (поле pos), а без него — последние добавленные сверху
const dayCmp = (a, b) => {
  if (a.pos == null && b.pos == null) return b.id > a.id ? 1 : -1;
  if (a.pos == null) return -1;   // только что добавленные (без pos) — наверх дня
  if (b.pos == null) return 1;
  return a.pos - b.pos || (b.id > a.id ? 1 : -1);
};

const monthKey = m => 'tx_' + m.replace('-', '_');

/* ===== Синхронизация =====
   Сохраняем не «весь список целиком», а изменения: какие записи добавлены/изменены и какие удалены.
   Перед записью изменения накладываются на свежую версию из облака, поэтому правки,
   сделанные на другом устройстве, не затираются. Пока запись идет, локальная правка «в приоритете». */
const pend = {put:new Map(), del:new Map()};
const inc = (map, k) => map.set(k, (map.get(k) || 0) + 1);
const dec = (map, k) => { const n = (map.get(k) || 1) - 1; n ? map.set(k, n) : map.delete(k); };
function mergeRecs(remote, puts, dels) {
  const map = new Map((remote || []).map(r => [r.id, r]));
  dels.forEach(id => map.delete(id));
  puts.forEach(r => map.set(r.id, r));
  const list = [...map.values()];
  return list.length ? list : null;
}
let _rt = null;
function refreshView() {
  clearTimeout(_rt);

// Применить пришедший из облака список коллекции (accounts / cats), не теряя незаписанных локальных правок
function applyColl(key, list) {
  const locals = new Map(D[key].filter(x => pend.put.has(key + '|' + x.id)).map(x => [x.id, x]));
  const out = (list || []).filter(x => !pend.del.has(key + '|' + x.id)).map(x => locals.get(x.id) || x);
  for (const [id, x] of locals) if (!out.some(o => o.id === id)) out.push(x);
  D[key] = out; refreshView();
}
function applyMonth(m, list) {
  const keep = D.tx.filter(t => t.date.slice(0,7) !== m || pend.put.has(t.date.slice(0,7) + '|' + t.id));
  const ids = new Set(keep.map(t => t.id));
  D.tx = keep.concat((list || []).filter(r => !ids.has(r.id) && r.date.slice(0,7) === m && !pend.del.has(m + '|' + r.id)));
  refreshView();
}
function syncColl(key, puts = [], dels = []) {
  puts.forEach(x => inc(pend.put, key + '|' + x.id)); dels.forEach(id => inc(pend.del, key + '|' + id));
  const done = () => { puts.forEach(x => dec(pend.put, key + '|' + x.id)); dels.forEach(id => dec(pend.del, key + '|' + id)); };
  return Store.update(key, remote => mergeRecs(remote, puts, dels), () => D[key])
    .then(list => { done(); applyColl(key, list); }, done);
}
// puts — операции (сохраняются в месяц своей даты); dels — [[id, месяц], ...]
function syncTx(puts = [], dels = []) {
  const byM = {}, g = m => byM[m] || (byM[m] = {puts:[], dels:[]});
  puts.forEach(t => g(t.date.slice(0,7)).puts.push(t));
  dels.forEach(([id, m]) => g(m).dels.push(id));
  return Promise.all(Object.entries(byM).map(([m, ch]) => {
    ch.puts.forEach(t => inc(pend.put, m + '|' + t.id)); ch.dels.forEach(id => inc(pend.del, m + '|' + id));
    const done = () => { ch.puts.forEach(t => dec(pend.put, m + '|' + t.id)); ch.dels.forEach(id => dec(pend.del, m + '|' + id)); };
    return Store.update(monthKey(m), remote => mergeRecs(remote, ch.puts, ch.dels), () => D.tx.filter(t => t.date.slice(0,7) === m))
      .then(list => { done(); applyMonth(m, list); }, done);
  }));
}
// Полная перезагрузка из облака (при возврате в приложение)

// Изменения балансов от одной операции: [[счет, сумма в валюте счета], ...]
// Возврат бывает двух видов: возврат расхода (деньги пришли, rk нет) и возврат дохода (rk:'income' — деньги ушли)
const isIncRefund = t => t.type === 'refund' && t.rk === 'income';
const catTypeOf = d => (d.type === 'income' || (d.type === 'refund' && d.rk === 'income')) ? 'income' : 'expense';
function deltas(t) {
  if (t.type === 'expense' || isIncRefund(t)) return [[t.acc, -accAmtOf(t)]];
  if (t.type === 'income' || t.type === 'refund') return [[t.acc, accAmtOf(t)]];
  if (t.type === 'transfer') return [[t.acc, -t.amount], [t.to, t.amount2 ?? t.amount]];
  return [];
}
// Остатки всех счетов на конец дня upTo (по умолчанию — с учетом всех операций)
function balances(upTo) {
  const b = {}; D.accounts.forEach(a => b[a.id] = +a.initial || 0);
  for (const t of D.tx) if (!upTo || t.date <= upTo) for (const [acc, v] of deltas(t)) b[acc] = (b[acc] || 0) + v;
  return b;
}
// История счета: [{date, delta, end}] по дням с операциями, по возрастанию
function accHistory(id) {
  const days = {};
  for (const t of D.tx) for (const [acc, v] of deltas(t)) if (acc === id) days[t.date] = (days[t.date] || 0) + v;
  let run = +(accById(id) || {}).initial || 0;
  return Object.keys(days).sort().map(date => ({date, delta:days[date], end:(run = r2(run + days[date]))}));
}
const balanceOn = (hist, initial, date) => { let v = +initial || 0; for (const h of hist) { if (h.date > date) break; v = h.end; } return v; };

/* ================= Аналитика ================= */
// Дата, к которой относится операция в аналитике: возврат с привязкой — к дате покупки
const effDate = t => { if (t.type === 'refund' && t.ref) { const o = txById(t.ref); if (o) return o.date; } return t.date; };
const analyze = inPeriod => analyzeBy(d => inPeriod(d.slice(0,7)));
function analyzeBy(inRange) {
  const exp = {}, inc = {}; let refunds = 0;
  for (const t of D.tx) {
    if (t.type === 'expense' && inRange(t.date)) { const k = t.cat || '_none'; exp[k] = (exp[k] || 0) + rubOf(t); }
    else if (t.type === 'income' && inRange(t.date)) { const k = t.cat || '_none'; inc[k] = (inc[k] || 0) + rubOf(t); }
    else if (t.type === 'refund' && inRange(effDate(t))) {
      const o = t.ref && txById(t.ref); const k = t.cat || (o && o.cat) || '_none';
      if (isIncRefund(t)) inc[k] = (inc[k] || 0) - rubOf(t);   // возврат дохода уменьшает доход
      else { exp[k] = (exp[k] || 0) - rubOf(t); refunds += rubOf(t); }
    }
  }
  const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
  return {exp, inc, totalExp:sum(exp), totalInc:sum(inc), refunds};
}
function rollup(map) {
  const g = {};
  for (const [cid, v] of Object.entries(map)) {
    const c = catById(cid); const top = c ? topOf(c) : null; const tid = top ? top.id : '_none';
    if (!g[tid]) g[tid] = {id:tid, cat:top, name: top ? top.name : 'Без категории', total:0, subs:{}};
    g[tid].total += v;
    const sid = c && c.parent ? c.id : '_self';
    g[tid].subs[sid] = (g[tid].subs[sid] || 0) + v;
  }
  return Object.values(g)
    .map(x => ({...x, subs: Object.entries(x.subs).map(([id, total]) => ({id, name: id === '_self' ? 'Без подкатегории' : catById(id).name, total})).filter(s => Math.abs(s.total) > 0.004).sort((a, b) => b.total - a.total)}))
    .filter(x => Math.abs(x.total) > 0.004).sort((a, b) => b.total - a.total);
}
const periodFn = () => ui.anPeriod === 'month' ? (m => m === ui.anMonth) : (m => m.slice(0,4) === ui.anMonth.slice(0,4));

function txRow(t, mv) {

  } else {

  if (t.auto === 'int') extra += `<div class="tag" style="color:var(--hint)">начислено автоматически</div>`;

  return `<div class="row" ${mv ? '' : `onclick="App.editTx('${t.id}')"`}>${ico}<div class="mid"><div class="tt">${esc(title)}</div><div class="sub">${sub}</div>${extra}</div><div class="amt ${cls}">${amt}${small ? `<div class="rub">${small}</div>` : ''}</div>${mv || ''}</div>`;

function groupByDay(list, reorder) {
  let html = '', cur = null;

    <button class="mv" ${i === n - 1 ? 'disabled' : ''} onclick="App.moveTx('${t.id}',1)" aria-label="Ниже">${icon('down', 18)}</button></div>`;
  for (const t of list) {

    if (reorder) { const day = list.filter(x => x.date === t.date), i = day.indexOf(t); html += txRow(t, mvs(t, i, day.length)); }
    else html += txRow(t);

}
// Сдвиг операции на одну позицию внутри своего дня
const opsVisible = t => ui.filter === 'all' || t.type === ui.filter;
function moveTx(id, dir) {
  const t = txById(id); if (!t) return;

  const nb = vis[vis.indexOf(t) + dir]; if (!nb) return;
  const full = D.tx.filter(x => x.date === t.date).sort(sortTx);
  const i = full.indexOf(t), j = full.indexOf(nb);
  [full[i], full[j]] = [full[j], full[i]];
  const puts = [];

      <button class="mv tall ${ui.reorder ? 'on' : ''}" onclick="App.toggleReorder()" aria-label="Изменить порядок">${icon('sort', 20)}</button></div>
    <div class="chips">${[['all','Все'],['expense','Расходы'],['income','Доходы'],['transfer','Переводы'],['refund','Возвраты']].map(([k, l]) => `<button class="chip ${ui.filter === k ? 'on' : ''}" onclick="App.set('filter','${k}')">${l}</button>`).join('')}</div>
    <div id="opsList"></div>`;
}
/* Поиск операции: по словам из названия, заметки, категории и по сумме.
   «1 500», «1500», «1500,5» — числа ищутся по сумме (в валюте операции, в рублях, на счете зачисления). */
function txMatcher(query) {
  const words = noYo(query).toLowerCase().replace(/(\d)[\s\u00a0]+(?=\d)/g, '$1').split(/\s+/).filter(Boolean);
  if (!words.length) return null;
  const isNum = w => /^-?\d+([.,]\d*)?$/.test(w);
  const amounts = t => [t.amount, t.rub, t.amount2, t.accAmt].filter(v => v != null).map(v => String(Math.abs(v)));
  return t => {
    const hay = noYo([t.title, t.note, catPath(t.cat)].join(' ')).toLowerCase();
    return words.every(w => {
      if (hay.includes(w)) return true;
      if (!isNum(w)) return false;
      const n = String(Math.abs(parseFloat(w.replace(',', '.'))));   // «1500,50» → «1500.5»
      return amounts(t).some(a => a === n || a.startsWith(n));
    });
  };
}
function renderOpsList() {
  const q = ui.search.trim().toLowerCase();
  const match = txMatcher(q);
  const list = D.tx.filter(t =>
    (match ? match(t) : t.date.slice(0,7) === ui.month) &&
    (ui.filter === 'all' || t.type === ui.filter)).sort(sortTx);
  const reorder = ui.reorder && !q;
  $('#opsList').innerHTML = (q ? `<div class="hint pad">Поиск по всем месяцам: ${list.length}</div>` : '') +
    (reorder ? `<div class="hint pad" style="padding-top:4px">Стрелки меняют порядок операций внутри дня. Нажмите ${icon('sort', 14).replace('class="i"', 'class="i" style="display:inline;vertical-align:-2px"')} еще раз, чтобы закончить.</div>` : '') +
    (list.length ? groupByDay(list, reorder) : `<div class="empty">${q ? 'Ничего не найдено' : 'В этом месяце операций нет.<br>Нажмите «+», чтобы добавить.'}</div>`);
}

function viewAn() {
  const isM = ui.anPeriod === 'month';
  const a = analyze(periodFn());

/* ===== 1. Сравнение с прошлым периодом =====
   Месяц — с прошлым месяцем, год — с прошлым годом. Если смотрим текущий месяц, сравниваем честно:
   те же дни (1–9 ноября против 1–9 октября), иначе в начале месяца всегда было бы «меньше». */
function compareBlock(cur) {
  const isM = ui.anPeriod === 'month', type = ui.anType, today = todayStr();
  let prev, label, curA = cur;
  if (isM) {
    const pm = shiftMonth(ui.anMonth, -1), pname = MONTHS_PREP[+pm.slice(5) - 1];
    if (ui.anMonth === today.slice(0,7)) {
      const day = +today.slice(8,10), lastPrev = new Date(+pm.slice(0,4), +pm.slice(5), 0).getDate(), upto = Math.min(day, lastPrev);
      const curTo = ui.anMonth + '-' + pad(day), prevTo = pm + '-' + pad(upto);
      curA = analyzeBy(d => d.slice(0,7) === ui.anMonth && d <= curTo);
      prev = analyzeBy(d => d.slice(0,7) === pm && d <= prevTo);
      label = `чем за 1–${upto} ${MONTHS_GEN[+pm.slice(5) - 1]}`;
    } else { prev = analyze(m => m === pm); label = `чем в ${pname}`; }
  } else {
    const py = String(+ui.anMonth.slice(0,4) - 1);
    prev = analyze(m => m.slice(0,4) === py); label = `чем в ${py} году`;
  }
  const map = type === 'expense' ? 'exp' : 'inc', tc = curA[type === 'expense' ? 'totalExp' : 'totalInc'], tp = prev[type === 'expense' ? 'totalExp' : 'totalInc'];
  if (!tc && !tp) return '';
  const word = type === 'expense' ? 'Потрачено' : 'Получено';
  const diff = tc - tp, pct = tp ? Math.round(Math.abs(diff) / tp * 100) : null;
  const good = type === 'expense' ? diff < 0 : diff > 0;           // для расходов «меньше» — хорошо, для доходов — «больше»
  const col = Math.abs(diff) < 0.5 ? 'var(--text)' : good ? 'var(--green)' : 'var(--red)';
  const head = Math.abs(diff) < 0.5 ? `${word} столько же, ${label}`
    : diff > 0 && tp && tc / tp >= 2 ? (() => { const k = Math.round(tc / tp * 10) / 10; return `${word} в ${NF.format(k)} ${k % 1 ? 'раза' : plural(k, 'раз', 'раза', 'раз')} больше, ${label}`; })()   // «в 2,5 раза больше» читается легче, чем «на 150%»
    : `${word} на ${pct != null ? pct + '%' : money(Math.abs(diff))} ${diff < 0 ? 'меньше' : 'больше'}, ${label}`;
  // По основным категориям
  const gc = new Map(rollup(curA[map]).map(g => [g.id, g])), gp = new Map(rollup(prev[map]).map(g => [g.id, g]));
  const ids = [...new Set([...gc.keys(), ...gp.keys()])];
  const rows = ids.map(id => { const c = gc.get(id), p = gp.get(id), g = c || p; return {id, g, cv:c ? c.total : 0, pv:p ? p.total : 0}; })
    .map(r => ({...r, d:r.cv - r.pv})).filter(r => Math.abs(r.d) >= 0.5).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  let h = `<h3>Сравнение</h3><div class="card"><div class="pad"><b style="color:${col}">${head}</b>
    <div class="hint">${money(tc)} против ${money(tp)}</div></div>`;
  rows.forEach(r => {
    const up = r.d > 0, bad = type === 'expense' ? up : !up;
    const p2 = r.pv ? ` (${up ? '+' : '−'}${Math.round(Math.abs(r.d) / r.pv * 100)}%)` : ' (новое)';
    h += `<div class="row" onclick="App.catTx('${r.id}',true)">${catBadge(r.g.cat)}<div class="mid"><div class="tt">${esc(r.g.name)}</div><div class="sub">${money(r.cv)} · было ${money(r.pv)}</div></div>
      <div class="amt" style="color:${bad ? 'var(--red)' : 'var(--green)'}">${up ? '↑' : '↓'} ${money(Math.abs(r.d))}<div class="hint">${p2.trim()}</div></div></div>`;
  });
  return h + '</div>';
}

/* ===== 2. Лимиты по категориям (на месяц) ===== */
/* Лимиты хранятся по месяцам: {id:'limits', months:{'2026-11':{total, items:{катId: сумма}}}}.
   Если у месяца своих лимитов нет — берутся из ближайшего прошлого месяца (как стартовые),
   а при первой правке месяц получает свою копию: остальные месяцы не меняются. */
const limitsRec = () => (D.settings || []).find(x => x.id === 'limits') || {id:'limits', months:{}};
function limitsFor(m) {
  const rec = limitsRec(), months = rec.months || {};
  if (months[m]) return {total:months[m].total || 0, items:months[m].items || {}, own:true, from:m};
  const prev = Object.keys(months).filter(k => k < m).sort().pop();
  if (prev) return {total:months[prev].total || 0, items:months[prev].items || {}, own:false, from:prev};
  return {total:rec.total || 0, items:rec.items || {}, own:false, from:null};   // старый формат (общие лимиты)
}
function saveMonthLimits(m, change) {
  const rec = limitsRec(), cur = limitsFor(m), months = {...(rec.months || {})};
  const mine = {total:cur.total || 0, items:{...cur.items}};
  change(mine);
  if (!mine.total) delete mine.total;
  months[m] = mine;
  const nrec = {id:'limits', months};
  if (rec.items) nrec.items = rec.items;       // старые общие лимиты остаются запасным вариантом для прошлых месяцев
  if (rec.total) nrec.total = rec.total;
  D.settings = (D.settings || []).filter(x => x.id !== 'limits').concat(nrec);
  syncColl('settings', [nrec]);
}
const monthName = m => MONTHS[+m.slice(5) - 1].toLowerCase();
const monthPrepName = m => MONTHS_PREP[+m.slice(5) - 1];
function catSpent(a, catId) {   // траты категории вместе с подкатегориями
  const ids = new Set([catId, ...childrenOf(catId).map(c => c.id)]);
  return Object.entries(a.exp).reduce((s, [k, v]) => ids.has(k) ? s + v : s, 0);
}
function limitsBlock(a) {
  const m = ui.anMonth, L = limitsFor(m), items = L.items, total = L.total || 0;
  const list = Object.entries(items).filter(([id]) => catById(id)).map(([id, lim]) => ({c:catById(id), lim, spent:catSpent(a, id)}))
    .sort((x, y) => y.spent / y.lim - x.spent / x.lim);
  const colOf = pct => pct > 100 ? 'var(--red)' : pct >= 80 ? '#ffd166' : 'var(--green)';
  let h = `<h3>Лимиты на ${monthName(m)}</h3>`;
  if (!L.own && L.from && (total || list.length)) h += `<div class="hint" style="margin:-4px 4px 8px">Перенесены с ${MONTHS_GEN[+L.from.slice(5) - 1]} — измените, если в этом месяце разбивка другая. Другие месяцы при этом не изменятся.</div>`;
  if (total) {
    const pct = a.totalExp / total * 100, rest = total - a.totalExp;
    h += `<div class="card pad limtotal" onclick="App.editTotalLimit()"><div class="hint">Общий лимит на траты</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:2px"><b style="font-size:20px">${money(a.totalExp)}</b><span class="hint">из ${money(total)}</span></div>
      <div class="bar" style="height:10px;margin-top:10px"><i style="width:${Math.min(100, pct)}%;background:${colOf(pct)}"></i></div>
      <div class="sub" style="margin-top:6px">${rest >= 0 ? `осталось ${money(rest)} · ${Math.round(pct)}% использовано` : `<span style="color:var(--red)">перерасход ${money(-rest)}</span>`}</div></div>`;
  } else {
    h += `<div class="card pad limtotal" onclick="App.editTotalLimit()"><b>Общий лимит на ${monthName(m)} не задан</b><div class="hint">Нажмите, чтобы задать бюджет на все траты месяца — например, 120 000 ₽.</div></div>`;
  }
  h += `<div class="card">`;
  if (!list.length) h += `<div class="pad hint">Задайте лимит на категорию — например, «Кафе — 10 000 ₽».</div>`;
  list.forEach(({c, lim, spent}) => {
    const pct = spent / lim * 100, rest = lim - spent, share = total ? Math.round(lim / total * 100) : null;
    h += `<div class="row" onclick="App.editLimit('${c.id}')">${catBadge(c)}<div class="mid"><div class="tt">${esc(catPath(c.id))}</div>
      <div class="bar"><i style="width:${Math.min(100, pct)}%;background:${colOf(pct)}"></i></div>
      <div class="sub">${rest >= 0 ? `осталось ${money(rest)}` : `<span style="color:var(--red)">перерасход ${money(-rest)}</span>`}</div></div>
      <div class="amt">${money(spent)}<div class="hint">из ${money(lim)}</div>${share != null ? `<div class="hint" style="color:var(--accent)">${share}% общего</div>` : ''}</div></div>`;
  });
  const sumCats = list.reduce((s, x) => s + x.lim, 0);
  if (total && list.length) h += `<div class="pad hint" style="padding-top:6px">Лимиты категорий вместе — ${money(sumCats)}, это ${Math.round(sumCats / total * 100)}% общего лимита${sumCats > total ? ' — больше, чем общий лимит' : ''}.</div>`;
  return h + `<div class="row link" onclick="App.editLimit()">+ Добавить лимит категории</div></div>`;
}
function editTotalLimit() {

}
function saveTotalLimit(remove) {

  if (!remove) { v = parseAmount(draft.total); if (!(v > 0)) return toast('Укажите сумму'); }
  saveMonthLimits(ui.anMonth, L => { L.total = remove ? 0 : r2(v); });

}
function editLimit(id) {

  openSheet(() => sheetHead(`${draft.limitFor ? 'Лимит' : 'Новый лимит'} на ${monthName(m)}`) + `
    <label>Категория${selField(catInner(draft.cat), 'App.pickCat()')}</label>
    <label>Лимит на ${monthName(m)}, ₽<input inputmode="decimal" value="${esc(draft.limit)}" placeholder="10 000" oninput="App.d('limit',this.value)"></label>
    <div class="hint pad">Меняется только ${monthName(m)} ${m.slice(0,4)}. Траты подкатегорий входят в лимит основной категории. Полоска желтеет с 80% и краснеет при перерасходе.</div>
    <button class="btn" onclick="App.saveLimit()">Сохранить</button>
    ${draft.limitFor ? `<button class="btn danger" onclick="App.delLimit()">Удалить лимит на ${monthName(m)}</button>` : ''}`);

function saveLimit() {
  const v = parseAmount(draft.limit);

  haptic('success'); back(); render();
}
function delLimit() {

  back(); render();
}

/* ===== 3. Сумма сбережений =====
   Накопления — видимые вклады и счета с пометкой «Накопления» (скрытые не учитываются, как и во «Всего денег»).
   Сбережения за период = их общий остаток на конец периода минус остаток на конец предыдущего.
   То есть пополнили 50 000, сняли 20 000, пришли проценты 3 000 — сбережения +33 000. */
const isSavings = a => !a.archived && (a.type === 'deposit' || (a.type === 'account' && a.savings));
function periodBounds() {
  const today = todayStr();
  if (ui.anPeriod === 'month') {
    const m = ui.anMonth, last = new Date(+m.slice(0,4), +m.slice(5), 0).getDate();
    const prevEnd = (() => { const d = new Date(+m.slice(0,4), +m.slice(5) - 1, 0); return dateStr(d); })();
    return {prevEnd, end:m === today.slice(0,7) ? today : `${m}-${pad(last)}`};
  }
  const y = ui.anMonth.slice(0,4);
  return {prevEnd:`${+y - 1}-12-31`, end:y === today.slice(0,4) ? today : `${y}-12-31`};
}
function savingsBlock(a) {
  const accs = D.accounts.filter(isSavings);
  let h = `<h3>Сумма сбережений</h3><div class="card pad">`;
  if (!accs.length) return h + `<div class="hint">Нет накопительных счетов. Вклады учитываются сами, а у счета включите галочку «Накопления» в его настройках.</div></div>`;
  const {prevEnd, end} = periodBounds();
  if (end < prevEnd || end > todayStr() && prevEnd >= todayStr()) return h + `<div class="hint">Этот период еще не наступил.</div></div>`;
  const b0 = balances(prevEnd), b1 = balances(end), rate = (d, c) => Rates.get(d, c) || Rates.get(todayStr(), c) || 0;
  let delta = 0, interest = 0;
  const per = accs.map(x => {
    const c = x.cur || 'RUB';
    if (c !== 'RUB') { Rates.need(prevEnd, () => ui.tab === 'an' && render()); Rates.need(end, () => ui.tab === 'an' && render()); }
    const d = (b1[x.id] || 0) * rate(end, c) - (b0[x.id] || 0) * rate(prevEnd, c);
    delta += d; return {x, d};
  });
  for (const t of D.tx) if (t.type === 'income' && t.date > prevEnd && t.date <= end && accs.some(x => x.id === t.acc) && t.cat && /процент/i.test(noYo(catPath(t.cat)))) interest += rubOf(t);
  const pname = ui.anPeriod === 'month' ? 'за ' + MONTHS[+ui.anMonth.slice(5) - 1].toLowerCase() : 'за ' + ui.anMonth.slice(0,4) + ' год';
  const col = delta >= 0 ? 'var(--green)' : 'var(--red)';
  h += `<b style="color:${col};font-size:20px">${delta >= 0 ? '+' : '−'}${money(Math.abs(delta))}</b>
    <div class="hint">${delta >= 0 ? 'Отложено' : 'Накопления уменьшились'} ${pname}${interest ? ` · в том числе проценты ${money(interest)}` : ''}</div>`;
  // процент от зарплаты — для ориентира
  const sal = D.cats.find(c => c.type === 'income' && noYo(c.name).trim().toLowerCase() === 'зарплата');
  if (sal && delta > 0) {
    const ids = new Set([sal.id, ...childrenOf(sal.id).map(c => c.id)]);
    const salary = Object.entries(a.inc).reduce((s, [k, v]) => ids.has(k) ? s + v : s, 0);
    if (salary > 0) h += `<div class="hint">Это ${Math.round(delta / salary * 100)}% зарплаты (${money(salary)})</div>`;
  }
  h += `<div style="margin-top:10px">${per.sort((p, q) => Math.abs(q.d) - Math.abs(p.d)).map(({x, d}) =>
    `<div class="srow"><span>${esc(x.name)}</span><b style="color:${Math.abs(d) < 0.5 ? 'var(--hint)' : d > 0 ? 'var(--green)' : 'var(--red)'}">${Math.abs(d) < 0.5 ? '0 ₽' : (d > 0 ? '+' : '−') + money(Math.abs(d))}</b></div>`).join('')}</div>
    <div class="hint" style="margin-top:8px">Прирост видимых вкладов и счетов с пометкой «Накопления»: остаток на конец периода минус остаток на его начало.</div>`;
  return h + '</div>';
}

/* ===== 4. Динамика всех денег на конец месяца (только после пин-кода) ===== */
function wealthBlock() {
  if (locked()) return `<h3>Динамика всех денег</h3><div class="card pad"><div class="hint">Скрыто пин-кодом.</div>
    <button class="btn sec" onclick="App.set('tab','acc')">${icon('lock', 16).replace('class="i"', 'class="i" style="display:inline;vertical-align:-3px"')} Ввести пин-код</button></div>`;
  const today = todayStr(), first = D.tx.reduce((m, t) => t.date < m ? t.date : m, today).slice(0,7);
  const end = ui.anPeriod === 'month' ? ui.anMonth : (ui.anMonth.slice(0,4) === today.slice(0,4) ? today.slice(0,7) : ui.anMonth.slice(0,4) + '-12');
  const months = []; for (let i = 11; i >= 0; i--) { const m = shiftMonth(end, -i); if (m >= first && m <= today.slice(0,7)) months.push(m); }
  if (!months.length) return '';
  const vis = D.accounts.filter(a => !a.archived);
  const vals = months.map(m => {
    const last = new Date(+m.slice(0,4), +m.slice(5), 0).getDate(), d = m === today.slice(0,7) ? today : `${m}-${pad(last)}`;
    const b = balances(d);
    let sum = 0;
    for (const a of vis) {
      const c = a.cur || 'RUB';
      let r = Rates.get(d, c);
      if (!r) { Rates.need(d, () => { if (ui.tab === 'an') render(); }); r = Rates.get(today, c) || 0; }
      sum += (b[a.id] || 0) * r;
    }
    return {m, d, v:sum};
  });
  // Шкала по реальному диапазону (а не от нуля), чтобы были видны изменения между месяцами
  const hi = Math.max(...vals.map(x => x.v)), lo0 = Math.min(...vals.map(x => x.v));
  const lo = lo0 > 0 ? Math.max(0, lo0 - (hi - lo0 || hi * 0.1) * 0.6) : lo0;
  const hgt = v => hi === lo ? 70 : Math.max(4, (v - lo) / (hi - lo) * 100);
  const si = Math.max(0, vals.findIndex(x => x.m === ui.wealthSel));
  const selI = vals.some(x => x.m === ui.wealthSel) ? si : vals.length - 1;   // выбранный столбик (по умолчанию последний)
  const lastV = vals[selI], prevV = vals[selI - 1];
  const dv = prevV ? lastV.v - prevV.v : 0;
  let h = `<h3>Динамика всех денег</h3><div class="card pad">
    <b style="font-size:17px">${signed(lastV.v)}</b><div class="hint">на ${lastV.d === today ? 'сегодня' : 'конец ' + MONTHS_GEN[+lastV.m.slice(5) - 1] + ' ' + lastV.m.slice(0,4)}${prevV ? ` · <span style="color:${dv >= 0 ? 'var(--green)' : 'var(--red)'}">${dv >= 0 ? '+' : '−'}${money(Math.abs(dv))}</span> за месяц` : ''}</div>
    <div class="wbars">${vals.map(x => `<div class="wcol ${x.m === lastV.m ? 'sel' : ''}" onclick="App.wsel('${x.m}')"><div class="wbar"><i style="height:${hgt(x.v)}%"></i></div><span>${MONTHS_SHORT[+x.m.slice(5) - 1]}</span></div>`).join('')}</div>
    <div class="hint">Нажмите на столбик, чтобы увидеть сумму за месяц. Видимые карты, счета, вклады и наличные на последний день месяца; валюта — по курсу ЦБ на ту дату.</div></div>`;
  return h;
}

/* ===== 5. История категории за 12 месяцев (в окне операций категории) ===== */
function catHistory(id, tree) {
  const ids = new Set(tree ? [id, ...childrenOf(id).map(c => c.id)] : [id]), key = ui.anType === 'expense' ? 'exp' : 'inc';
  const end = ui.anPeriod === 'month' ? ui.anMonth : ui.anMonth.slice(0,4) + '-12';
  const months = Array.from({length:12}, (_, i) => shiftMonth(end, i - 11));
  const vals = months.map(m => { const a = analyze(mm => mm === m); return {m, v:Object.entries(a[key]).reduce((s, [k, v]) => ids.has(k) ? s + v : s, 0)}; });
  const nz = vals.filter(x => x.v > 0), avg = nz.length ? nz.reduce((s, x) => s + x.v, 0) / nz.length : 0;
  const max = Math.max(...vals.map(x => x.v), 1), col = id === '_none' ? '#5b606b' : catColor(topOf(catById(id)));
  const sel = vals.find(x => x.m === ui.histSel);
  return `<div class="card pad">${sel ? `<b style="font-size:17px">${money(sel.v)}</b><div class="hint">${monthLabel(sel.m)}${avg ? ` · в среднем ${money(avg)} в месяц` : ''}</div>`
      : `<div class="hint">За 12 месяцев${avg ? ` · в среднем ${money(avg)} в месяц` : ''} · нажмите на столбик, чтобы увидеть сумму</div>`}
    <div class="wbars">${vals.map(x => `<div class="wcol ${(sel ? x.m === sel.m : ui.anPeriod === 'month' && x.m === ui.anMonth) ? 'sel' : ''}" onclick="App.hsel('${x.m}')"><div class="wbar"><i style="height:${x.v > 0 ? Math.max(3, x.v / max * 100) : 0}%;background:${col}"></i></div><span>${MONTHS_SHORT[+x.m.slice(5) - 1]}</span></div>`).join('')}</div></div>`;
}

/* Круговая диаграмма. segs = [{name, value, color, onclick}] */
function ring(segs, head, center, sub) {
  segs = segs.filter(x => x.value > 0);
  const total = segs.reduce((s, x) => s + x.value, 0);
  if (!total) return '';
  const R = 70, C = 2 * Math.PI * R, gap = segs.length > 1 ? 2.5 : 0;
  let off = 0, arcs = '';
  segs.forEach(x => {
    const len = x.value / total * C;
    arcs += `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${x.color}" stroke-width="22" stroke-dasharray="${Math.max(0.5, len - gap).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" style="cursor:pointer" onclick="${x.onclick}"><title>${esc(x.name)}</title></circle>`;
    off += len;
  });
  const legend = segs.map(x => `<button class="lg" onclick="${x.onclick}"><i style="background:${x.color}"></i><span class="lgn">${esc(x.name)}</span>${x.amt ? `<span class="lga">${x.amt}</span>` : ''}<b>${(x.value / total * 100).toFixed(x.value / total < 0.1 ? 1 : 0)}%</b></button>`).join('');
  return `<h3>${head}</h3><div class="card pad donut">
    <div class="dwrap"><svg viewBox="0 0 180 180" class="dsvg"><circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--card2)" stroke-width="22"/><g transform="rotate(-90 90 90)">${arcs}</g></svg>
      <div class="dc">${center}${sub ? `<span class="hint">${sub}</span>` : ''}</div></div>
    <div class="lgs ${segs.some(x => x.amt) ? 'one' : ''}">${legend}</div></div>`;
}
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
// Категории за выбранный период
function donut(groups, type) {
  const segs = groups.filter(g => g.total > 0).map(g => ({name:g.name, value:g.total, color:g.cat ? catColor(g.cat) : '#5b606b', onclick:`App.slice('${g.id}')`}));
  const total = segs.reduce((s, x) => s + x.value, 0), title = type === 'expense' ? 'Расходы' : 'Доходы';
  return ring(segs, `${title} по категориям — ${periodLabel()}`,
    `<span class="hint">${title}</span><b>${money(total)}</b>`, `${segs.length} ${plural(segs.length, 'категория', 'категории', 'категорий')}`);
}
// Цвет счета — по порядку в списке
// Порядок счетов внутри своей группы (Карты, Счета, Вклады, Наличные) — поле order, меняется стрелками
const accOrd = a => a.order ?? (1e6 + D.accounts.indexOf(a));
const accSorted = list => list.slice().sort((a, b) => (Object.keys(ACC_TYPES).indexOf(a.type) - Object.keys(ACC_TYPES).indexOf(b.type)) || (accOrd(a) - accOrd(b)));  // по группам, внутри — ваш порядок
function moveAcc(id, dir) {
  const a = accById(id); if (!a) return;
  const sibs = accSorted(D.accounts.filter(x => x.type === a.type && !!x.archived === !!a.archived));
  const i = sibs.indexOf(a), j = i + dir;
  if (j < 0 || j >= sibs.length) return;
  [sibs[i], sibs[j]] = [sibs[j], sibs[i]];
  const puts = [];
  sibs.forEach((x, k) => { if (x.order !== k) { x.order = k; puts.push(x); } });
  if (puts.length) syncColl('accounts', puts);
  try { IN_TG && TG.HapticFeedback.selectionChanged(); } catch (_) {}
  render();
}
// Цвет счета: выбранный вручную, иначе — по порядку в списке
const accColor = a => (a && a.color) || COLORS[Math.max(0, D.accounts.indexOf(a)) % COLORS.length];
const accIc = (a, size = 20) => `<div class="ic" style="color:${accColor(a)};background:${accColor(a)}22">${icon(ACC_ICON[a.type] || 'card', size)}</div>`;

/* ================= Пин-код для страницы «Счета» =================
   Сам код нигде не хранится — только его хеш (SHA-256) в вашем облаке Telegram, в коде на GitHub его нет.
   «Открыто» помнится только в памяти: свернули и развернули — открыто; закрыли приложение — снова нужен код. */
let pinOk = false;
const pinRec = () => (D.settings || []).find(x => x.id === 'pin');
const pinOn = () => !!(pinRec() && pinRec().hash);
const locked = () => pinOn() && !pinOk;
async function pinHash(p) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fin-pin-v1:' + p));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const pin = {entry:'', mode:'unlock', first:'', err:''};   // mode: unlock | set1 | set2
function viewPin() {
  const titles = {unlock:'Введите пин-код', set1:pinOn() ? 'Новый пин-код' : 'Придумайте пин-код', set2:'Повторите пин-код'};
  const sub = pin.err || (pin.mode === 'unlock' ? 'Страница «Счета» защищена' : 'Он будет нужен, чтобы открыть «Счета»');
  const keys = ['1','2','3','4','5','6','7','8','9', pin.mode === 'unlock' ? '' : 'skip', '0', 'del'];
  return `<div class="pin"><div class="lock">${icon('lock', 26)}</div><h2>${titles[pin.mode]}</h2>
    <div class="hint" style="${pin.err ? 'color:var(--red)' : ''}">${sub}</div>
    <div class="dots ${pin.err ? 'err' : ''}">${[0,1,2,3].map(i => `<i class="${i < pin.entry.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="keys">${keys.map(k => k === '' ? '<span></span>'
      : k === 'del' ? `<button class="ghost" onclick="App.pinKey('del')" aria-label="Стереть">${icon('bksp', 26)}</button>`
      : k === 'skip' ? `<button class="ghost small" onclick="App.pinCancel()">${pinOn() ? 'Отмена' : 'Позже'}</button>`
      : `<button onclick="App.pinKey('${k}')">${k}</button>`).join('')}</div></div>`;
}
async function pinKey(k) {
  if (k === 'del') { pin.entry = pin.entry.slice(0, -1); pin.err = ''; return render(); }
  if (pin.entry.length >= 4) return;
  pin.entry += k; pin.err = ''; render();
  if (pin.entry.length < 4) return;
  const code = pin.entry;
  if (pin.mode === 'unlock') {
    if (await pinHash(code) === pinRec().hash) { pinOk = true; pin.entry = ''; haptic('success'); }
    else { pin.entry = ''; pin.err = 'Неверный пин-код'; haptic('error'); }
  } else if (pin.mode === 'set1') { pin.first = code; pin.entry = ''; pin.mode = 'set2'; }
  else {
    if (code === pin.first) {
      const rec = {id:'pin', hash:await pinHash(code)};
      D.settings = (D.settings || []).filter(x => x.id !== 'pin').concat(rec);
      syncColl('settings', [rec]);
      pinOk = true; ui.pinSetup = false; pin.mode = 'unlock'; pin.entry = ''; pin.first = '';
      haptic('success'); toast('Пин-код установлен');
    } else { pin.mode = 'set1'; pin.entry = ''; pin.first = ''; pin.err = 'Коды не совпали, попробуйте еще раз'; haptic('error'); }
  }
  setTimeout(render, pin.err ? 0 : 120);
}
function pinCancel() { ui.pinSetup = false; ui.pinLater = true; pin.mode = 'unlock'; pin.entry = ''; pin.first = ''; pin.err = ''; render(); }
function pinChange() { ui.pinSetup = true; pin.mode = 'set1'; pin.entry = ''; pin.first = ''; pin.err = ''; render(); window.scrollTo(0, 0); }
async function pinOff() {
  if (!await ask('Отключить пин-код? «Счета» будут открываться без него.')) return;
  D.settings = (D.settings || []).filter(x => x.id !== 'pin');
  syncColl('settings', [], ['pin']); ui.pinLater = true; toast('Пин-код отключен'); render();
}

/* ================= Заполненность облака =================
   Лимит Telegram: 1024 записи по 4096 байт. Считаем так же, как сохраняет приложение:
   каждый блок (счета, категории, настройки, операции месяца) режется на куски до 3800 байт; +1 запись — оглавление. */
function cloudUsage() {
  const enc = new TextEncoder(), MAXB = 3800, LIMIT = 1024;
  const size = v => v && (!Array.isArray(v) || v.length) ? enc.encode(JSON.stringify(v)).length : 0;
  const blobs = [size(D.accounts), size(D.cats), size(D.settings)];
  const byMonth = {};
  for (const t of D.tx) (byMonth[t.date.slice(0,7)] = byMonth[t.date.slice(0,7)] || []).push(t);
  for (const list of Object.values(byMonth)) blobs.push(size(list));
  const keys = 1 + blobs.reduce((s, b) => s + Math.ceil(b / MAXB), 0), bytes = blobs.reduce((s, b) => s + b, 0);
  // Темп: сколько байт добавили операции за последние 90 дней
  const from = (() => { const d = new Date(todayStr() + 'T12:00:00'); d.setDate(d.getDate() - 90); return dateStr(d); })();
  const recent = D.tx.filter(t => t.date >= from).reduce((s, t) => s + enc.encode(JSON.stringify(t)).length + 1, 0);
  const keysPerMonth = recent / 3 / MAXB + 0.5;                 // +0,5 — неполный последний кусок месяца
  const left = Math.max(0, LIMIT - 10 - keys);                  // небольшой запас на служебные записи
  const monthsLeft = recent > 0 ? left / keysPerMonth : null;
  return {keys, bytes, limit:LIMIT, pct:keys / LIMIT * 100, monthsLeft};
}
function usageBlock() {
  const u = cloudUsage(), pct = Math.max(0.1, u.pct), col = pct >= 90 ? 'var(--red)' : pct >= 70 ? '#ffd166' : 'var(--green)';
  const fmtLeft = mo => { if (mo == null) return ''; if (mo >= 240) return 'больше 20 лет'; const y = Math.floor(mo / 12), m = Math.floor(mo % 12);
    return [y ? `${y} ${plural(y, 'год', 'года', 'лет')}` : '', m ? `${m} ${plural(m, 'месяц', 'месяца', 'месяцев')}` : ''].filter(Boolean).join(' ') || 'меньше месяца'; };
  return `<div class="day">${Store.cloud ? 'Облако Telegram' : 'Хранилище (тестовый режим)'}</div><div class="card pad">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><b style="font-size:17px">Занято ${pct < 1 ? pct.toFixed(1) : Math.round(pct)}%</b><span class="hint">${u.keys} из ${u.limit} записей</span></div>
    <div class="bar" style="height:8px;margin-top:8px"><i style="width:${Math.min(100, pct)}%;background:${col}"></i></div>
    <div class="hint" style="margin-top:8px">${NF.format(Math.round(u.bytes / 1024))} КБ данных · ${D.tx.length} ${plural(D.tx.length, 'операция', 'операции', 'операций')}${u.monthsLeft != null ? `. При нынешнем темпе места хватит примерно на ${fmtLeft(u.monthsLeft)}` : ''}.</div></div>`;
}

function viewAcc() {

    <button class="btn" onclick="App.editAcc()">+ Добавить карту, счет или вклад</button>`;
  h += `<div class="day">Данные</div><div class="card pad">
    <div class="hint">${Store.cloud ? 'Данные хранятся в облаке Telegram и доступны на всех ваших устройствах. Их видите только вы.' : 'Тестовый режим: приложение открыто не из Telegram, данные хранятся только в этом браузере.'}</div>
    <button class="btn sec" onclick="App.exportCSV()">Выгрузить операции (CSV)</button>

/* История счета: остаток на любую дату, график и операции по дням */
function spark(vals, days) {
  const w = 300, hgt = 110, p = 6;
  // шкала по реальному диапазону остатка (а не от нуля), чтобы были видны изменения; ноль — только если остаток уходил в минус
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min < 0 && max > 0) { /* оставляем как есть, линия нуля будет видна */ } else { const padv = (max - min) * 0.15 || Math.abs(max) * 0.05 || 1; min -= padv; max += padv; }
  const rng = (max - min) || 1;
  const x = i => p + i * (w - 2 * p) / (vals.length - 1), y = v => p + (max - v) * (hgt - 2 * p) / rng;
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const zero = min < 0 ? `<line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="var(--hint)" stroke-dasharray="3 3"/>` : '';
  return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" preserveAspectRatio="none">${zero}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="legend" style="justify-content:space-between;margin:4px 0 0"><span>${shortDate(days[0])}</span><span>${shortDate(days[days.length - 1])}</span></div>`;
}
/* ================= Проценты на остаток =================
   У счета: int = {rate: % годовых, open: дата открытия, since: с какой даты начислять, skip: [даты, которые вы удалили]}.
   Каждый месяц в число открытия (в коротких месяцах — в последний день) создается доход «Проценты: …».
   Расчет: по остатку на конец каждого дня × ставка / 365 (в високосный год / 366), с капитализацией. */
const addMonthsClamp = (ds, k) => {
  const y = +ds.slice(0,4), m = +ds.slice(5,7) - 1 + k, d = +ds.slice(8,10);
  const Y = y + Math.floor(m / 12), M = ((m % 12) + 12) % 12, last = new Date(Y, M + 1, 0).getDate();
  return `${Y}-${pad(M + 1)}-${pad(Math.min(d, last))}`;
};
// Прогноз «крупный», если больше 100 ₽ (валюту пересчитываем в рубли по курсу ЦБ)
const bigInterest = (n, cur) => n.amount * (Rates.get(todayStr(), cur || 'RUB') || 0) > 100;
const hasInterest = a => a && (a.type === 'account' || a.type === 'deposit');   // проценты — только у счетов и вкладов
const dayMonth = ds => `${+ds.slice(8,10)} ${MONTHS_GEN[+ds.slice(5,7) - 1]}`;
// Проценты за дни [start, end) по ежедневному остатку
function intAmount(a, start, end) {
  const hist = accHistory(a.id), d = new Date(start + 'T12:00:00');
  let sum = 0;
  while (dateStr(d) < end) {
    const y = d.getFullYear(), yd = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365;
    const bal = balanceOn(hist, a.initial, dateStr(d));
    if (bal > 0) sum += bal * a.int.rate / 100 / yd;
    d.setDate(d.getDate() + 1);
  }
  return r2(sum);
}
// Ближайшее начисление: дата и примерная сумма (будущие дни — по текущему остатку)
function nextInterest(a) {
  const I = a.int; if (!hasInterest(a) || !I || !(I.rate > 0) || !I.open) return null;   // скрытые тоже: они не закрыты
  const today = todayStr(); let k = 1, pd;
  while ((pd = addMonthsClamp(I.open, k)) <= today) k++;
  return {date:pd, amount:intAmount(a, addMonthsClamp(I.open, k - 1), pd)};
}
// Категория для начисления: по вкладу — «Проценты по вкладу», по счету (и картам, наличным) — «Проценты по счету».
// Если такой категории нет, она создается рядом с «Проценты по вкладу» (в «Проценты и кэшбэк»).
function interestCat(a) {
  const want = a.type === 'deposit' ? 'Проценты по вкладу' : 'Проценты по счету';
  const norm = x => noYo(x).trim().toLowerCase();
  // Ищем вашу категорию по началу названия: «Проценты по счету», «Проценты по счетам», «проценты по вкладам» — все подойдет
  const re = a.type === 'deposit' ? /^проценты по вклад/ : /^проценты по сч[её]т/;
  let c = D.cats.find(x => x.type === 'income' && norm(x.name) === norm(want)) || D.cats.find(x => x.type === 'income' && re.test(norm(x.name)));
  if (c) return c;
  const sib = D.cats.find(x => x.type === 'income' && /^проценты по /.test(norm(x.name)));
  const parent = sib && sib.parent ? catById(sib.parent) : D.cats.find(x => x.type === 'income' && !x.parent && /процент/.test(norm(x.name)));
  c = {id:uid(), type:'income', name:want, icon:'percent'};
  if (parent) { c.parent = parent.id; c.order = childrenOf(parent.id).reduce((m, x) => Math.max(m, catOrd(x)), -1) + 1; }
  else { c.color = COLORS[2]; c.order = parents('income').reduce((m, x) => Math.max(m, catOrd(x)), -1) + 1; }
  D.cats.push(c); syncColl('cats', [c]);
  return c;
}
let genBusy = false;
async function generateInterest() {
  if (genBusy) return; genBusy = true;
  try {
    const today = todayStr(), puts = [];
    for (const a of D.accounts) {
      const I = a.int; if (!hasInterest(a) || !I || !(I.rate > 0) || !I.open) continue;
      for (let k = 1; k < 1200; k++) {
        const pd = addMonthsClamp(I.open, k);
        if (pd > today) break;
        if (pd <= (I.since || '')) continue;                       // до включения функции — не начисляем
        const id = `int_${a.id}_${pd.replace(/-/g, '')}`;          // одинаковый id на всех устройствах — без дублей
        if (txById(id) || (I.skip || []).includes(pd)) continue;
        const amt = intAmount(a, addMonthsClamp(I.open, k - 1), pd);
        if (!(amt > 0)) continue;
        const t = {id, type:'income', date:pd, amount:amt, acc:a.id, auto:'int', title:'Проценты: ' + a.name};
        t.cat = interestCat(a).id;
        const cur = a.cur || 'RUB';
        if (cur !== 'RUB') {
          let r = Rates.get(pd, cur);
          if (!r) { try { await Rates.load(pd); r = Rates.get(pd, cur); } catch (e) {} }
          if (!r) continue;                                         // нет курса — начислим при следующем открытии
          t.cur = cur; t.rub = r2(amt * r);
        }
        D.tx.push(t); puts.push(t);                                 // сразу в список — следующий месяц считается с капитализацией
      }
    }
    if (puts.length) { syncTx(puts); render(); toast(puts.length === 1 ? 'Начислены проценты' : `Начислены проценты: ${puts.length}`); }
  } finally { genBusy = false; }
}

    }
    h += `<div class="hint pad">Начальный остаток: ${signed(+a.initial || 0, c)}</div>`;
    return h;
  });

/* ================= Порядок категорий: стрелки вверх / вниз ================= */
function moveCat(id, dir) {
  const c = catById(id); if (!c) return;
  const sibs = c.parent ? childrenOf(c.parent) : parents(c.type);
  const i = sibs.findIndex(x => x.id === id), j = i + dir;

/* ================= Горячая кнопка: быстрые действия ================= */
/* ===== Предложения частых расходов =====
   Правила:
   1. Берем расходы за последние 90 дней (без автоначислений).
   2. «Одинаковые» — с тем же названием, категорией, картой списания и валютой.
   3. Предлагаем только то, что встречалось минимум 2 раза.
   4. Вес каждого раза: свежие важнее (вес затухает примерно вдвое за 3 недели),
      а если операция была в такой же день недели, как сегодня, — вес ×1,5 (будни/выходные привычки).
   5. Если сегодня такая операция уже внесена столько раз, сколько вы обычно вносите ее максимум за день
      (метро 3 раза в день — значит после третьего), вес вдвое меньше. До этого предложение остается на месте.
   6. Сумма — та, что повторялась чаще всего. Если все суммы разные — сумма не подставляется (0 ₽, вводите сами).
      Берем 3 лучших. */
function suggestions() {
  const today = todayStr(), T = new Date(today + 'T12:00:00'), wd = T.getDay();
  const from = (() => { const d = new Date(T); d.setDate(d.getDate() - 90); return dateStr(d); })();
  const groups = new Map();
  for (const t of D.tx) {
    if (t.type !== 'expense' || t.auto || t.date < from || t.date > today || !accById(t.acc)) continue;
    const key = [noYo((t.title || '').trim().toLowerCase()), t.cat || '', t.acc, curOf(t)].join('|');
    const dt = new Date(t.date + 'T12:00:00'), age = (T - dt) / 864e5;
    const w = Math.exp(-age / 30) * (dt.getDay() === wd ? 1.5 : 1);
    let g = groups.get(key);
    if (!g) groups.set(key, g = {n:0, score:0, amounts:new Map(), last:t, today:0, perDay:new Map()});
    g.n++; g.score += w;
    g.amounts.set(t.amount, (g.amounts.get(t.amount) || 0) + 1);
    if (t.date > g.last.date || (t.date === g.last.date && t.id > g.last.id)) g.last = t;
    if (t.date === today) g.today++; else g.perDay.set(t.date, (g.perDay.get(t.date) || 0) + 1);
  }
  return [...groups.values()].filter(g => g.n >= 2).map(g => {
    let amount = g.last.amount, best = 0;
    for (const [a, c] of g.amounts) if (c > best || (c === best && a === g.last.amount)) { best = c; amount = a; }
    if (best < 2) amount = 0;   // ни одна сумма не повторялась — не угадываем
    const c = catById(g.last.cat);
    const maxPerDay = Math.max(1, ...g.perDay.values());   // сколько раз максимум за один день в прошлом
    return {score:g.score * (g.today >= maxPerDay ? 0.5 : 1), n:g.n, amount, cur:curOf(g.last), acc:g.last.acc, cat:g.last.cat || '', title:g.last.title || (c ? c.name : 'Расход')};
  }).sort((a, b) => b.score - a.score).slice(0, 3);
}
