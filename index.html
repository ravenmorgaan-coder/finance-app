async function delAcc() {
  const id = draft.id;
  if (D.tx.some(t => t.acc === id || t.to === id)) return toast('По счету есть операции. Отметьте «Скрыть», чтобы убрать его из списка.');
  if (!await ask('Удалить счет?')) return;
  D.accounts = D.accounts.filter(a => a.id !== id);
  syncColl('accounts', [], [id]); stack.length = 0; showSheet(); render();
}

/* ================= Категории ================= */
function editCat(id, parentId) {
  const c = id ? catById(id) : null;
  draft = {id:c ? c.id : null, name:c ? c.name : '', icon:c ? (c.icon !== undefined ? c.icon : (NAME_ICON[noYo(c.name)] || '')) : '', color:c ? catColor(c) : COLORS[D.cats.length % COLORS.length], parent:c ? c.parent || '' : (parentId || ''), type:c ? c.type : (parentId ? catById(parentId).type : ui.catTab)};
  openSheet(catForm);
}
function catForm() {
  const d = draft, hasKids = d.id && childrenOf(d.id).length;
  return sheetHead(d.id ? 'Категория' : (d.parent ? 'Новая подкатегория' : 'Новая категория')) + `
    <div class="hint">${d.type === 'income' ? 'Категория доходов' : 'Категория расходов'}</div>
    <label>Название<input value="${esc(d.name)}" oninput="App.d('name',this.value)"></label>
    <label>Иконка${d.parent ? ' <span style="opacity:.7">(если не выбрать — как у основной категории)</span>' : ''}<div class="igrid" style="color:${d.parent ? catColor(catById(d.parent)) : d.color}">
      <button class="${!d.icon ? 'on' : ''}" onclick="App.dr('icon','')" title="Без иконки">${d.parent ? icon('none', 20) : 'Аа'}</button>
      ${Object.keys(CAT_ICONS).map(k => `<button class="${d.icon === k ? 'on' : ''}" onclick="App.dr('icon','${k}')">${icon(k, 22)}</button>`).join('')}
    </div></label>
    ${!d.parent ? `<label>Цвет<div class="sw">${COLORS.map(c => `<button style="background:${c}" class="${c === d.color ? 'on' : ''}" onclick="App.dr('color','${c}')"></button>`).join('')}</div></label>` : ''}
    ${hasKids ? '' : `<label>Входит в категорию${selField(d.parent ? `${catBadge(catById(d.parent))}<span class="grow">${esc(catById(d.parent).name)}</span>` : `<span class="grow">Нет — это основная категория</span>`, 'App.pickParent()')}</label>`}
    <button class="btn" onclick="App.saveCat()">Сохранить</button>
    ${d.id ? `<button class="btn danger" onclick="App.delCat()">Удалить</button>` : ''}`;
}
function saveCat() {
  const d = draft;
  if (!d.name.trim()) return toast('Введите название');
  const c = {id:d.id || uid(), type:d.type, name:d.name.trim()};
  if (d.parent) c.parent = d.parent; else c.color = d.color;
  const old = d.id && catById(d.id);
  if (old && (old.parent || '') === (d.parent || '') && old.order != null) c.order = old.order;
  else if (!old || (old.parent || '') !== (d.parent || '')) {
    const sibs = d.parent ? childrenOf(d.parent) : parents(d.type);
    c.order = sibs.filter(x => x.id !== c.id).reduce((m, x) => Math.max(m, catOrd(x)), -1) + 1;  // в конец списка
  }
  c.icon = d.icon || '';  // пустая строка — осознанно «без иконки»
  const i = D.cats.findIndex(x => x.id === c.id);
  if (i >= 0) D.cats[i] = c; else D.cats.push(c);
  syncColl('cats', [c]); haptic('success'); back(); render();
}
async function delCat() {
  const c = catById(draft.id); if (!c) return back();
  if (childrenOf(c.id).length) return toast('Сначала удалите или перенесите подкатегории');
  const used = D.tx.filter(t => t.cat === c.id);
  const target = c.parent ? `«${catById(c.parent).name}»` : '«Без категории»';
  if (!await ask(`Удалить «${c.name}»?` + (used.length ? ` ${used.length} операц. перейдут в ${target}.` : ''))) return;
  used.forEach(t => { if (c.parent) t.cat = c.parent; else delete t.cat; });
  D.cats = D.cats.filter(x => x.id !== c.id);
  syncColl('cats', [], [c.id]); if (used.length) syncTx(used); back(); render();
}

/* Операции категории за период (из аналитики) */
function catTx(id, tree) {
  ui.histSel = null;
  openSheet(() => {
    // Выбран столбик — показываем операции того месяца; иначе — месяца/года, открытого в аналитике
    const per = ui.histSel ? (m => m === ui.histSel) : periodFn();
    const ids = new Set(tree ? [id, ...childrenOf(id).map(c => c.id)] : [id]);
    const catOf = t => { const o = t.type === 'refund' && t.ref && txById(t.ref); return t.cat || (o && o.cat) || '_none'; };
    const list = D.tx.filter(t => ui.anType === 'expense'
        ? ((t.type === 'expense' && per(t.date.slice(0,7))) || (t.type === 'refund' && !isIncRefund(t) && per(effMonth(t))))
        : ((t.type === 'income' && per(t.date.slice(0,7))) || (isIncRefund(t) && per(effMonth(t)))))
      .filter(t => ids.has(catOf(t))).sort(sortTx);
    const name = id === '_none' ? 'Без категории' : (catPath(id) + (!tree && childrenOf(id).length ? ' — общее' : ''));
    return sheetHead(esc(name)) + catHistory(id, tree) + `<div class="hint" style="margin:4px 4px 0">Операции · ${ui.histSel ? monthLabel(ui.histSel) : periodLabel()}</div>` + (list.length ? groupByDay(list) : '<div class="empty">Нет операций</div>');
  });
}

/* ================= Экспорт и копии ================= */
function showText(title, text, hint) {
  openSheet(() => sheetHead(title) + `<div class="hint" style="margin-bottom:8px">${hint}</div><textarea id="copyArea" class="copy" readonly>${esc(text)}</textarea><button class="btn" onclick="App.copy()">Скопировать</button>`);
}
async function copy() {
  const el = $('#copyArea');
  try { await navigator.clipboard.writeText(el.value); toast('Скопировано'); }
  catch (e) { el.select(); try { document.execCommand('copy'); toast('Скопировано'); } catch (e2) { toast('Выделите текст и скопируйте вручную'); } }
}
function exportCSV() {
  const rows = [['Дата','Тип','Сумма','Валюта','Сумма в рублях','Счет','Счет получатель','Зачислено','Категория','Подкатегория','Название','Заметка','Возврат за']];
  D.tx.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    const c = catById(t.cat), p = c && c.parent ? catById(c.parent) : null, o = t.ref && txById(t.ref);
    const num = v => v == null ? '' : String(v).replace('.', ',');
    const neg = t.type === 'expense' || isIncRefund(t);
    rows.push([t.date, isIncRefund(t) ? 'Возврат дохода' : TYPES[t.type], num(neg ? -t.amount : t.amount), curOf(t), t.type === 'transfer' ? '' : num(neg ? -rubOf(t) : rubOf(t)), accName(t.acc), t.to ? accName(t.to) : '', t.amount2 != null ? num(t.amount2) + ' ' + accCur(t.to) : '', p ? p.name : (c ? c.name : ''), p ? c.name : '', t.title || '', t.note || '', o ? `${o.date} ${o.title || ''}` : '']);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n');
  showText('Операции (CSV)', csv, 'Скопируйте и вставьте в Google Таблицы или Excel, либо сохраните в файл с расширением .csv.');
}
function backup() {
  showText('Резервная копия', JSON.stringify({app:'fin', v:1, date:todayStr(), accounts:D.accounts, cats:D.cats, tx:D.tx}),
    'Скопируйте этот текст и сохраните его, например в «Избранном» Telegram. Из копии можно восстановить все данные.');
}
function restore() {
  openSheet(() => sheetHead('Восстановление') + `<div class="hint">Вставьте текст резервной копии. Все текущие данные будут заменены.</div><textarea id="restoreArea" class="copy" placeholder="{&quot;app&quot;:&quot;fin&quot;, …}"></textarea><button class="btn" onclick="App.doRestore()">Восстановить</button>`);
}
async function doRestore() {
  let data;
  try { data = JSON.parse($('#restoreArea').value); } catch (e) { return toast('Текст не похож на резервную копию'); }
  if (!data || !Array.isArray(data.accounts) || !Array.isArray(data.cats) || !Array.isArray(data.tx)) return toast('В копии нет нужных данных');
  if (!await ask(`Заменить данные? В копии: ${data.accounts.length} счетов, ${data.cats.length} категорий, ${data.tx.length} операций.`)) return;
  const months = new Set([...D.tx, ...data.tx].map(t => t.date.slice(0,7)));
  D = {accounts:data.accounts, cats:data.cats, tx:data.tx, settings:D.settings || []};
  // Восстановление — намеренная полная замена, без слияния
  Store.save('accounts', D.accounts); Store.save('cats', D.cats);
  months.forEach(m => { const list = D.tx.filter(t => t.date.slice(0,7) === m); Store.save(monthKey(m), list.length ? list : null); });
  stack.length = 0; showSheet(); render(); toast('Данные восстановлены');
}

/* ================= Связка с кнопками ================= */
window.App = {
  newTx, editTx, saveTx, delTx, dtype, pickRef, df, accView,
  moveCat, moveTx, moveAcc, pick,
  toggleHidden(type) { if (typeof ui.showHidden !== 'object' || !ui.showHidden) ui.showHidden = {}; ui.showHidden[type] = !ui.showHidden[type]; render(); },
  toggleAccReorder() { ui.accReorder = !ui.accReorder; render(); }, pickAcc, pickCur,
  toggleReorder() { ui.reorder = !ui.reorder; render(); },
  pinKey, pinCancel, pinChange, pinOff, editLimit, saveLimit, delLimit, editTotalLimit, saveTotalLimit,
  wsel(m) { ui.wealthSel = m; render(); },
  hsel(m) { ui.histSel = ui.histSel === m ? null : m; showSheet(); },
  useSuggestion, qa, qaToggle(v) { ui.qaOpen = v === undefined ? !ui.qaOpen : v; renderQA(); },
  rk(v) { const d = draft; if (d.rk === v) return; d.rk = v; d.ref = ''; const c = catById(d.cat); if (c && c.type !== catTypeOf(d)) d.cat = ''; showSheet(); },
  refSearch(v) { refQ = v; const el = $('#refList'); if (el) el.innerHTML = refListHtml(); },
  pickRefId(id) { back(); pickRef(id); }, pickAccType, pickRefTx, pickParent, pickCat, setCat,
  amt(v) { draft.amount = v; recalc(); },
  rubIn(v) { draft.rub = v; draft.rubManual = true; },
  a2In(v) { draft.amount2 = v; draft.a2Manual = true; },
  accDate(v) { ui.accDate = v || todayStr(); render(); },
  histDate(v) { ui.accDate = v || todayStr(); render(); showSheet(); }, editAcc, saveAcc, delAcc, editCat, saveCat, delCat, catTx,
  exportCSV, backup, restore, doRestore, copy, back,
  d(k, v) { draft[k] = v; },
  dr(k, v) { draft[k] = v; showSheet(); },
  set(k, v) { ui[k] = v; render(); },
  search(v) { ui.search = v; renderOpsList(); },
  opsMonth(k) { ui.month = shiftMonth(ui.month, k); render(); },
  anShift(k) { ui.anMonth = shiftMonth(ui.anMonth, ui.anPeriod === 'month' ? k : 12 * k); render(); },
  pickMonth(m) { ui.anPeriod = 'month'; ui.anMonth = m; render(); window.scrollTo(0, 0); },
  toggle(id) { ui.open[id] = !ui.open[id]; render(); },
  slice(id) {
    const hasSubs = D.cats.some(c => c.parent === id);
    if (!hasSubs) return App.catTx(id, true);
    ui.open[id] = true; render();
    const el = document.querySelector(`[data-g="${id}"]`); if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
  },
};


async function init() {
  $('#fab').innerHTML = icon('plus', 26);
  document.querySelectorAll('#tabs button').forEach(b => b.insertAdjacentHTML('afterbegin', icon(b.dataset.tab)));
  if (IN_TG) {
    try { TG.ready(); TG.expand(); } catch (e) {}
    try { TG.BackButton.onClick(back); } catch (e) {}
    try { TG.setHeaderColor('#1a0d33'); TG.setBackgroundColor('#0d0619'); TG.setBottomBarColor && TG.setBottomBarColor('#160d2c'); } catch (e) {}
  }
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; ui.qaOpen = false; render(); window.scrollTo(0, 0); });
  try {
    const res = await Store.loadAll();
    if (!res) { seed(); await Store.save('accounts', D.accounts); await Store.save('cats', D.cats); }
    else {
      D = {accounts:res.accounts || [], cats:res.cats || [], tx:[], settings:res.settings || []};
      for (const [k, v] of Object.entries(res)) if (k.startsWith('tx_') && Array.isArray(v)) D.tx.push(...v);
    }
  } catch (e) {
    $('#view').innerHTML = `<div class="empty">Не удалось загрузить данные: ${esc(e)}<button class="btn" onclick="location.reload()">Повторить</button></div>`;
    return;
  }
  render();
  // Вернулись в приложение (с другого устройства могли что-то добавить) — подтягиваем свежие данные
  generateInterest();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reloadAll().then(generateInterest); });
  if (IN_TG) { try { TG.onEvent('activated', reloadAll); } catch (e) {} }
}
init();
</script>
